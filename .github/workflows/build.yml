name: Build and check
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build JobApplicationTracker.sln --configuration Release
      - run: dotnet run --project tests/JobTracker.Tests --configuration Release --no-build
